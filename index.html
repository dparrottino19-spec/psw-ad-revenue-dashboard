var cur="90d", sortKey="closed", sortDir=-1, view="cards";
function money(v){if(v===null||v===undefined)return"n/a";
  return "$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function money0(v){if(v===null||v===undefined)return"n/a";
  return "$"+Math.round(Number(v)).toLocaleString("en-US");}
function roas(rev,sp){if(sp===null||sp===undefined||sp===0)return null;return rev/sp;}
function roasTxt(r){return r===null?"n/a":r.toFixed(2)+"x";}
function rowsOf(k){return D[k].rows.map(function(a){
  var o={adId:a[0],name:a[1],camp:a[2],matched:!!a[3],closed:a[4],spend:a[5],
         purchases:a[6],potential:a[7],why:a[8],merged:a[9],geo:a[10]};
  o.roas=roas(o.closed,o.spend); o.roaspot=roas(o.potential,o.spend); return o;});}
function val(o,k){return k==="roas"||k==="roaspot"?(o[k]===null?-1:o[k]):(o[k]===null?-1:o[k]);}
function sorted(k){var r=rowsOf(k);
  r.sort(function(a,b){var d=val(a,sortKey)-val(b,sortKey);
    if(d!==0)return sortDir<0?-d:d; return b.closed-a.closed;});
  return r;}

function renderNote(){

  var p=[];
  p.push("<p><b>Match rate "+m.matchRate.toFixed(1)+"%</b> of closed revenue in this window tied to a specific live ad. "+

    money(m.unmatchedClosed)+" came from ads that no longer carry that name in the account.</p>");
  if(merged) p.push("<p>"+merged+" row"+(merged>1?"s":"")+" cover more than one ad sharing an identical name. Searchlight cannot split revenue between identically named ads, so their spend is summed and they are shown as a single row rather than dropped.</p>");
  p.push("<p><b>Revenue is credited to the date of the first click, not the date the job closed.</b> This window therefore understates recently launched ads, whose jobs are still open, and short-window ROAS can look inflated. Use the revenue potential column to see pipeline that has not closed yet.</p>");
  document.getElementById("note").innerHTML=p.join("");

function bars(rs){var m=0;rs.forEach(function(r){var v=val(r,sortKey);if(v>m)m=v;});return m;}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var COLS=[["name","Ad"],["camp","Campaign"],["closed","Closed revenue"],["spend","Spend"],

function renderBody(){if(view==="cards")renderCards();else renderTable();}
function renderAll(){renderRanges();renderKpis();renderNote();renderBody();renderNon();renderFoot();}
