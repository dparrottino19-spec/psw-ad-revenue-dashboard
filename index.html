const GEN = "August 27, 2026";

let cur = "90d", sortKey = "4", dir = -1, view = "cards";

const money = n => "$" + Math.round(n).toLocaleString("en-US");
const money2 = n => "$" + n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const roas = (r,s) => s > 0 ? (r/s).toFixed(1)+"x" : "n/a";
const fmtD = s => { const p=s.split("-"); return p[1].replace(/^0/,"")+"/"+p[2].replace(/^0/,"")+"/"+p[0].slice(2); };
function val(a,k){
  if(k==="roas")  return a[5]>0 ? a[4]/a[5] : -1;
  if(k==="roasp") return a[5]>0 ? a[7]/a[5] : -1;
  return a[+k];
}
function rows(){
  const a = D[cur].ads.slice();
  a.sort((x,y)=>{ const d=(val(x,sortKey)-val(y,sortKey))*dir; return d!==0?d:(y[4]-x[4]); });
  return a;
}
function drawRanges(){

}
function drawKpis(){
  const t = D[cur].tot;

    ["ROAS Closed",roas(t.closed,t.acctSpend),0],["Purchases",String(t.pay),0],
    ["Revenue Potential",money(t.pot),0],["Sold Revenue",money(t.sold),0]];
  $("kpis").innerHTML = k.map(([l,v,h]) =>
    '<div class="kpi'+(h?" hero":"")+'"><div class="l">'+l+'</div><div class="v">'+v+"</div></div>").join("");
}
function drawNote(){
  const t = D[cur].tot;
  const rate = t.closed>0 ? (100*t.matchRev/t.closed).toFixed(1) : "100.0";
  let s = "<b>Match rate " + rate + "% of closed revenue.</b> " + t.nMatched + " of " + t.nAds +
    " revenue-producing sources resolved to a specific Meta ad. ";
  s += t.unmatchRev>0 ? ("Unmatched closed revenue " + money2(t.unmatchRev) + " (plus " + money2(t.unmatchPot) +
       " of potential) comes from link-in-bio traffic, stripped UTMs and deleted ads, and stays visible below rather than being reassigned. ")
     : "All closed revenue in this window resolved to a specific ad. ";
  s += "<b>Spend:</b> the Ad Spend tile is the full Meta account spend for this window (" + money2(t.acctSpend) +
       "), which is what Ads Manager shows. Of that, " + money2(t.adsSpend) + " went to the ads listed below and " +
       money2(t.noRevSpend) + " went to ads that produced no closed revenue and no open pipeline in this window. " +
       "The account ROAS tile divides by the full account spend; each ad row divides by that ad's own spend. ";
  s += "<b>Timing:</b> revenue is credited to the date of the first click, not the close date, so this view structurally undervalues recently launched ads and short-window ROAS can look inflated.";
  $("note").innerHTML = s;
}
function drawCards(){
  const a = rows(), top = Math.max(...a.map(x=>Math.max(val(x,sortKey),0)), 0.0001);
  $("cards").innerHTML = a.map((x,i) => {

    return '<div class="ad'+(ty==="unmatched"?" un":"")+'">'+th+
      '<div class="meta"><span class="rank'+(ty==="unmatched"?" u":"")+'">#'+(i+1)+(ty==="unmatched"?" unmatched":"")+"</span>"+
      '<div class="nm">'+esc(nm)+'</div><div class="cp">'+esc(cp)+'</div><div class="id">'+(id||"no ad id")+"</div>"+
      '<div class="tiles">'+

function tile(l,v){ return '<div class="t"><div class="l">'+l+'</div><div class="v">'+v+"</div></div>"; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function drawTable(){

    money2(t.noRevSpend)+"</td><td>0</td><td>n/a</td><td>"+money2(0)+"</td><td>n/a</td></tr>"+
    "<tr><td>Account total</td><td>all Meta spend in window</td><td>"+money2(t.closed)+"</td><td>"+
    money2(t.acctSpend)+"</td><td>"+t.pay+"</td><td>"+roas(t.closed,t.acctSpend)+"</td><td>"+money2(t.pot)+"</td><td>"+

    "Creative images are rendered ad previews captured from Meta. This page is a snapshot, not a live feed. Generated "+GEN+".";
}

draw();
