var RK=['28','90','ytd'], cur='90', sortKey='4', sortDir=-1, view='cards';
function money(v){ if(v===null||v===undefined) return 'n/a';
  return '$'+Math.round(v).toLocaleString('en-US'); }
function roas(c,s){ if(s===null||s===undefined||s===0) return null; return c/s; }
function rx(v){ return v===null?'n/a':v.toFixed(2)+'x'; }
function val(a,k){
  if(k==='roas') return roas(a[4],a[5]);
  if(k==='roasp') return roas(a[7],a[5]);
  return a[k];
}
function sorted(){
  var ads=D[cur].ads.slice();
  ads.sort(function(x,y){
    var a=val(x,sortKey), b=val(y,sortKey);
    if(a===null||a===undefined)a=-1; if(b===null||b===undefined)b=-1;
    return (a-b)*sortDir;
  });
  return ads;
}
function renderRanges(){
  var h='';
  RK.forEach(function(k){
    h+='<button data-r="'+k+'" class="'+(k===cur?'on':'')+'"><b>'+D[k].label+'</b><span>'+D[k].dates+'</span></button>';
  });
  document.getElementById('ranges').innerHTML=h;
  [].forEach.call(document.querySelectorAll('#ranges button'),function(b){
    b.onclick=function(){ cur=b.getAttribute('data-r'); render(); };
  });
}
function renderKpis(){
  var d=D[cur], r=roas(d.closed,d.spend), rp=roas(d.pot,d.spend);
  var k=[['Closed revenue',money(d.closed),1],['Ad spend',money(d.spend),0],
         ['ROAS closed',rx(r),0],['Purchases',String(d.pc),0],
         ['Revenue potential',money(d.pot),0],['Sold revenue',money(d.sold),0]];
  document.getElementById('kpis').innerHTML=k.map(function(x){
    return '<div class="kpi'+(x[2]?' hero':'')+'"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>';
  }).join('');
  document.getElementById('hr').textContent=d.label;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderNote(){
  var d=D[cur];
  var merged=d.ads.filter(function(a){return a[9]>1;}).length;
  var h='<b>How to read this.</b> '+d.match.toFixed(1)+'% of closed revenue in this window resolves to a specific ad. '+
    money(d.nonad_closed)+' came through channels that are not an ad and is listed separately below'+
    (d.unmatched_closed>0?', and '+money(d.unmatched_closed)+' carries an ad name that no longer exists in the account (renamed or deleted)':'')+'. '+
    (merged>0?'Where '+merged+' ad name'+(merged>1?'s resolve':' resolves')+' to more than one live ad, those ads are merged into one row and their spend summed, because Searchlight cannot split revenue between identically named ads. ':'')+
    '<br><b>Timing.</b> Revenue is credited to the date of the first click, not the date the job closed. Short windows therefore understate recently launched ads, and their ROAS can look inflated.';
  document.getElementById('note').innerHTML=h;
}
function renderCards(){
  var ads=sorted(), top=null;
  ads.forEach(function(a){ var v=val(a,sortKey); if(v!==null&&v!==undefined&&(top===null||v>top)) top=v; });
  var h='';
  ads.forEach(function(a,i){
    var r=roas(a[4],a[5]), rp=roas(a[7],a[5]);
    var img = a[0] ? '<div class="thumb"><img loading="lazy" src="'+a[0]+'.jpg" alt=""></div>'
                   : '<div class="ph">'+esc(a[1])+'</div>';
    var badge='';

    else if(!a[3]) badge='<span class="badge u">'+esc(a[8])+'</span>';
    var v=val(a,sortKey); var pct=(top&&v>0)?Math.max(2,Math.round(v/top*100)):0;

      '<span class="rank">'+(i+1)+'</span><span class="nm">'+esc(a[1])+'</span>'+
      '<div class="sm">'+esc(a[2])+(a[0]?' &middot; ad '+a[0]:'')+'</div>'+badge+
      '<div class="tiles">'+
      '<div class="tile"><div class="k">Closed revenue</div><div class="v">'+money(a[4])+'</div></div>'+
      '<div class="tile"><div class="k">Spend</div><div class="v">'+money(a[5])+'</div></div>'+
      '<div class="tile"><div class="k">Purchases</div><div class="v">'+a[6]+'</div></div>'+

      '</div><div class="prog"><i style="width:'+pct+'%"></i></div>'+
      '</div></div>';
  });
  document.getElementById('cards').innerHTML=h;
}
var COLS=[['Ad','name'],['Campaign','camp'],['Closed revenue','4'],['Spend','5'],
          ['Purchases','6'],['ROAS','roas'],['Revenue potential','7'],['ROAS potential','roasp']];
function renderTable(){

  });

  h+='</tbody></table>';

}

   'Ads appear here when they have closed revenue or open pipeline above zero, so recently launched ads with pipeline and no closed revenue yet are included on purpose. '+
   'This page is a snapshot generated Sep 18, 2026, not a live feed.';

function render(){
