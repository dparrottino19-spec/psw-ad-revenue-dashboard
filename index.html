var RANGE="90d", SORT="closed", DIR=-1, VIEW="cards";
var METRICS=[
 {k:"closed", t:"Closed revenue", f:"money"},
 {k:"spend",  t:"Spend in window", f:"money"},
 {k:"pay",    t:"Purchases", f:"int"},
 {k:"roas",   t:"Return on ad spend", f:"x"},
 {k:"pot",    t:"Revenue potential", f:"money"},
 {k:"roasp",  t:"ROAS potential", f:"x"}
];
function money(n){return "$"+(n||0).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0});}
function money2(n){return "$"+(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function xf(n){return n===null?"n/a":n.toFixed(2)+"x";}
function fmt(v,f){return f==="money"?money(v):f==="int"?String(v):xf(v);}
function rows(){
  return D[RANGE].ads.map(function(a){
    var spend=a[5];
    return {id:a[0],name:a[1],camp:a[2],type:a[3],closed:a[4],spend:spend,pay:a[6],pot:a[7],
            roas:spend>0?a[4]/spend:null, roasp:spend>0?a[7]/spend:null};
  });
}
function sorted(){
  var r=rows();
  r.sort(function(a,b){
    var x=a[SORT], y=b[SORT];
    if(x===null&&y===null) return 0;
    if(x===null) return 1;
    if(y===null) return -1;
    if(x===y) return b.closed-a.closed;
    return DIR*(x-y)*-1*-1;
  });
  if(DIR===-1) r.sort(function(a,b){var x=a[SORT],y=b[SORT];if(x===null)return 1;if(y===null)return -1;return y-x||b.closed-a.closed;});
  else r.sort(function(a,b){var x=a[SORT],y=b[SORT];if(x===null)return 1;if(y===null)return -1;return x-y||b.closed-a.closed;});
  return r;
}
function renderSwitch(){
  var h="";
  ["28d","90d","ytd"].forEach(function(k){
    h+='<button data-r="'+k+'" aria-pressed="'+(k===RANGE)+'"><span class="t">'+D[k].label+'</span><span class="d">'+D[k].dates+'</span></button>';
  });
  document.getElementById("switch").innerHTML=h;
  document.getElementById("hdrRange").textContent=D[RANGE].label+" | "+D[RANGE].dates;
}
function renderKpis(){
  var v=D[RANGE];
  var roas=v.slSpend>0?(v.closed/v.slSpend):null;
  var h="";
  h+='<div class="kpi hero"><div class="k">Closed revenue</div><div class="v">'+money(v.closed)+'</div><div class="n">Closed and completed jobs</div></div>';
  h+='<div class="kpi"><div class="k">Ad spend</div><div class="v">'+money(v.slSpend)+'</div><div class="n">Meta spend, whole account</div></div>';
  h+='<div class="kpi"><div class="k">ROAS closed</div><div class="v">'+xf(roas)+'</div><div class="n">Closed revenue / ad spend</div></div>';
  h+='<div class="kpi"><div class="k">Purchases</div><div class="v">'+v.pay+'</div><div class="n">Paying customers</div></div>';
  h+='<div class="kpi"><div class="k">Revenue potential</div><div class="v">'+money(v.pot)+'</div><div class="n">Closed plus open pipeline</div></div>';
  h+='<div class="kpi"><div class="k">Sold revenue</div><div class="v">'+money(v.sold)+'</div><div class="n">Sold, not yet completed</div></div>';
  document.getElementById("kpis").innerHTML=h;
}
function renderNote(){
  var v=D[RANGE];
  var h="<b>"+v.matchRate.toFixed(1)+"% of closed revenue is matched to a specific ad.</b> ";
  h+="The remaining "+money2(v.unClosed)+" closed and "+money2(v.unPot)+" of revenue potential could not be tied to a live ad: link in bio traffic, visits with the utm_content stripped, and ads that were deleted or renamed after the click. Those rows are still listed below, marked Unmatched, so nothing is hidden. ";
  h+="Revenue is credited to the date of the <b>first click</b>, not the date the job closed, so a short window structurally undervalues recently launched ads and short window ROAS can look inflated. The 90 day view is the default for that reason.";
  document.getElementById("note").innerHTML=h;
}
function renderSorts(){
  var el=document.getElementById("sorts");
  el.innerHTML='<span class="lbl">Sort by</span>'+METRICS.map(function(m){
    var arrow=m.k===SORT?(DIR===-1?" \u2193":" \u2191"):"";
    return '<button data-s="'+m.k+'" aria-pressed="'+(m.k===SORT)+'">'+m.t+arrow+'</button>';
  }).join("");
  document.getElementById("views").innerHTML=
    '<button data-v="cards" aria-pressed="'+(VIEW==="cards")+'">Creative</button>'+
    '<button data-v="table" aria-pressed="'+(VIEW==="table")+'">Table</button>';
}
function renderCards(){
  var r=sorted();
  var m=METRICS.filter(function(x){return x.k===SORT;})[0];
  var top=0;
  r.forEach(function(a){var x=a[SORT];if(x!==null&&x>top)top=x;});
  var h="";
  r.forEach(function(a,i){
    var img=a.id?'<div class="thumb"><img loading="lazy" src="'+a.id+'.jpg" alt=""></div>'
                :'<div class="ph">'+esc(a.name)+'<br><br>no creative available</div>';
    var tag=a.type==="unmatched"?'<span class="tag un">Unmatched</span>':(a.type==="merged"?'<span class="tag mg">Merged duplicates</span>':"");
    var val=a[SORT];
    var pct=(top>0&&val!==null)?Math.max(1,Math.round(val/top*100)):0;
    h+='<div class="card">'+img+'<div class="body">';
    h+='<span class="rank">#'+(i+1)+'</span><span class="nm">'+esc(a.name)+'</span>'+tag;
    h+='<div class="meta">'+esc(a.camp)+(a.id?' &middot; ad '+a.id:'')+'</div>';
    h+='<div class="tiles">';
    METRICS.forEach(function(mm){h+='<div class="tile"><div class="k">'+mm.t+'</div><div class="v">'+fmt(a[mm.k],mm.f)+'</div></div>';});
    h+='</div>';
    h+='<div class="prog"><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><div class="cap">'+pct+'% of the top ad on '+m.t.toLowerCase()+'</div></div>';
    h+='</div></div>';
  });
  document.getElementById("cards").innerHTML=h;
}
function renderTable(){
  var r=sorted(), v=D[RANGE];
  var h='<table><thead><tr><th>Ad</th><th>Campaign</th>';
  METRICS.forEach(function(m){h+='<th data-s="'+m.k+'"'+(m.k===SORT?' aria-sort="'+(DIR===-1?"descending":"ascending")+'"':'')+'>'+m.t+(m.k===SORT?(DIR===-1?" \u2193":" \u2191"):"")+'</th>';});
  h+='</tr></thead><tbody>';
  r.forEach(function(a){
    h+='<tr><td>'+esc(a.name)+(a.type==="unmatched"?' <span class="tag un">Unmatched</span>':(a.type==="merged"?' <span class="tag mg">Merged</span>':''))+'</td><td>'+esc(a.camp)+'</td>';
    METRICS.forEach(function(m){h+='<td>'+fmt(a[m.k],m.f)+'</td>';});
    h+='</tr>';
  });
  var ts=r.reduce(function(s,a){return s+a.spend;},0);
  h+='</tbody><tfoot><tr><td>Total, '+r.length+' ads</td><td></td>';
  h+='<td>'+money(v.closed)+'</td><td>'+money(ts)+'</td><td>'+v.pay+'</td><td>'+xf(ts>0?v.closed/ts:null)+'</td><td>'+money(v.pot)+'</td><td>'+xf(ts>0?v.pot/ts:null)+'</td>';
  h+='</tr></tfoot></table>';
  document.getElementById("tableWrap").innerHTML=h;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function renderFoot(){
  var v=D[RANGE];
  document.getElementById("foot").innerHTML=
   "Generated September 2, 2026. This page is a snapshot, not a live feed.<br>"+
   "Closed revenue, revenue potential and purchases come from SearchLight, attribution channel Facebook, joined to Meta by utm_content and campaign id. Purchases are SearchLight paying customers, meaning closed deals from the CRM, and will never match the purchase column in Ads Manager.<br>"+
   "Both ROAS columns on each ad divide by the Meta spend shown in the same row, so the arithmetic is checkable on screen. That will not tie exactly to SearchLight's own ROAS, which uses its internal spend allocation. Per ad spend in this window totals "+money2(v.spend)+" against "+money2(v.slSpend)+" of account spend, the difference being ads that produced no revenue or pipeline in the window and so are not listed.";
}
function renderAll(){
  renderSwitch();renderKpis();renderNote();renderSorts();
  if(VIEW==="cards"){document.getElementById("cards").classList.remove("hide");document.getElementById("tableWrap").classList.add("hide");renderCards();}
  else{document.getElementById("cards").classList.add("hide");document.getElementById("tableWrap").classList.remove("hide");renderTable();}
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button,th[data-s]");
  if(!b)return;
  if(b.dataset.r){RANGE=b.dataset.r;renderAll();return;}
  if(b.dataset.v){VIEW=b.dataset.v;renderAll();return;}
  if(b.dataset.s){ if(SORT===b.dataset.s){DIR=DIR*-1;} else {SORT=b.dataset.s;DIR=-1;} renderAll(); return;}
});
renderAll();renderFoot();
</script>
