const M=[["closed","Closed revenue"],["spend","Spend in window"],["pc","Purchases"],["roas","Return on ad spend"],["pot","Revenue potential"],["roasP","ROAS potential"]];
const IDX={closed:4,spend:5,pc:6,pot:7};
let R="90d",S="closed",SD=-1,VIEW="cards";
const $=i=>document.getElementById(i);
const m=(n)=>"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0});
const m2=(n)=>"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const rx=(r,s)=>s>0?(r/s).toFixed(1)+"x":null;
function val(a,k){if(k==="roas")return a[5]>0?a[4]/a[5]:-1;if(k==="roasP")return a[5]>0?a[7]/a[5]:-1;return a[IDX[k]];}
function rows(){const a=D[R].ads.slice();a.sort((x,y)=>{const d=(val(x,S)-val(y,S))*SD;return d||(y[4]-x[4]);});return a;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function ranges(){$("ranges").innerHTML=Object.keys(D).map(k=>'<button class="rb'+(k===R?" on":"")+'" data-r="'+k+'"><b>'+D[k].short+'</b><small>'+D[k].label+'</small></button>').join("");
 [...document.querySelectorAll(".rb")].forEach(b=>b.onclick=()=>{R=b.dataset.r;draw();});}
function kpis(){const d=D[R];const roas=d.spend>0?(d.closed/d.spend).toFixed(2)+"x":"n/a";
 $("kpis").innerHTML=[["Closed revenue",m(d.closed),1],["Ad spend",m(d.spend),0],["ROAS closed",roas,0],["Purchases",d.pc,0],["Revenue potential",m(d.pot),0],["Sold revenue",m(d.sold),0]]
 .map(k=>'<div class="k'+(k[2]?" hero":"")+'"><div class="l">'+k[0]+'</div><div class="v">'+k[1]+'</div></div>').join("");}
function note(){const d=D[R];
 $("note").innerHTML='<b>'+d.matchRate.toFixed(1)+'% of closed revenue is matched to a specific ad.</b> '+m2(d.unmatchedClosed)+' of closed revenue could not be tied to a single live ad (direct traffic, phone calls, stripped UTMs, duplicate ad names, or ads since deleted); those rows stay listed below without spend or ROAS. Revenue is credited to the date of the first click, not the date the job closed, so this view structurally undervalues recently launched ads and short-window ROAS can read high.';}
function sorts(){$("sorts").innerHTML=M.map(x=>'<button class="sb'+(x[0]===S?" on":"")+'" data-s="'+x[0]+'">'+x[1]+(x[0]===S?(SD<0?" \u2193":" \u2191"):"")+'</button>').join("");
 [...$("sorts").querySelectorAll(".sb")].forEach(b=>b.onclick=()=>{if(S===b.dataset.s)SD=-SD;else{S=b.dataset.s;SD=-1;}draw();});}
function cards(){const a=rows();const top=Math.max(...a.map(x=>Math.max(val(x,S),0)))||1;
 $("cards").innerHTML=a.map((r,i)=>{const im=r[0]?'<img src="'+r[0]+'.jpg" loading="lazy" alt="">':'<div class="ph">'+esc(r[1])+'<br><br>creative not available</div>';
  const ro=rx(r[4],r[5]),rp=rx(r[7],r[5]);
  const st=[["Closed revenue",m2(r[4])],["Spend in window",m2(r[5])],["Purchases",r[6]],["Return on ad spend",ro||"n/a"],["Revenue potential",m2(r[7])],["ROAS potential",rp||"n/a"]]
   .map(s=>'<div class="s"><div class="l">'+s[0]+'</div><div class="v">'+s[1]+'</div></div>').join("");
  const w=Math.max(0,Math.min(100,val(r,S)/top*100));
  return '<div class="card"><div class="thumb">'+im+'</div><div class="meta"><span class="rank">'+(i+1)+'</span><span class="nm">'+esc(r[1])+'</span>'+(r[3]==="U"?'<span class="tag">unmatched in Meta</span>':"")+
   '<div class="sub">'+esc(r[2])+(r[0]?' &middot; ad '+r[0]:"")+'</div><div class="stats">'+st+'</div><div class="prog"><i style="width:'+w.toFixed(1)+'%"></i></div></div></div>';}).join("");}
function table(){const a=rows();const H=[["name","Ad"],["camp","Campaign"],["closed","Closed revenue"],["spend","Spend"],["pc","Purchases"],["roas","ROAS"],["pot","Revenue potential"],["roasP","ROAS potential"]];
 const tc=a.reduce((s,r)=>s+r[4],0),ts=a.reduce((s,r)=>s+r[5],0),tp=a.reduce((s,r)=>s+r[6],0),to=a.reduce((s,r)=>s+r[7],0);
 $("table").innerHTML='<table><thead><tr>'+H.map(h=>'<th'+(h[0]===S?' class="on"':"")+(IDX[h[0]]!==undefined||h[0]==="roas"||h[0]==="roasP"?' data-s="'+h[0]+'"':"")+'>'+h[1]+'</th>').join("")+'</tr></thead><tbody>'+
  a.map(r=>'<tr><td>'+esc(r[1])+(r[3]==="U"?' <span class="tag">unmatched</span>':"")+'</td><td>'+esc(r[2])+'</td><td>'+m2(r[4])+'</td><td>'+m2(r[5])+'</td><td>'+r[6]+'</td><td>'+(rx(r[4],r[5])||"n/a")+'</td><td>'+m2(r[7])+'</td><td>'+(rx(r[7],r[5])||"n/a")+'</td></tr>').join("")+
  '</tbody><tfoot><tr><td>Total, '+a.length+' ads</td><td></td><td>'+m2(tc)+'</td><td>'+m2(ts)+'</td><td>'+tp+'</td><td>'+(rx(tc,ts)||"n/a")+'</td><td>'+m2(to)+'</td><td>'+(rx(to,ts)||"n/a")+'</td></tr></tfoot></table>';
 [...$("table").querySelectorAll("th[data-s]")].forEach(h=>h.onclick=()=>{if(S===h.dataset.s)SD=-SD;else{S=h.dataset.s;SD=-1;}draw();});}
function draw(){const d=D[R];$("rl").textContent=d.short+" \u00b7 "+d.label;
 ranges();kpis();note();sorts();
 $("h2").textContent=d.ads.length+" ads with closed revenue or open pipeline";
 cards();table();
 $("cards").className=VIEW==="cards"?"":"hide";$("table").className=VIEW==="table"?"":"hide";
 $("tCards").className="sb"+(VIEW==="cards"?" on":"");$("tTable").className="sb"+(VIEW==="table"?" on":"");
 $("foot").innerHTML='Generated August 23, 2026. Snapshot, not live. Closed revenue, purchases (Searchlight Paying Customers) and revenue potential come from Searchlight, Meta Performance By, Facebook attribution channel. Spend and creative come from the Meta ad account. Both ROAS columns divide by the Meta spend shown on this page, so the math is checkable here, and they will not tie exactly to Searchlight ROAS, which uses its own internal spend allocation. Ad spend in the KPI strip is total Meta account spend for the window, which includes ads with no attributed revenue. Every ad with closed revenue or open pipeline above zero appears, including recently launched ads that have pipeline but nothing closed yet. Creative images are rendered Facebook mobile feed previews captured at build time.';}
$("tCards").onclick=()=>{VIEW="cards";draw();};$("tTable").onclick=()=>{VIEW="table";draw();};
draw();

</script>
