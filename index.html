var RK=['d28','d90','ytd'];
var state={range:'d90',sort:'4',dir:-1,view:'cards'};
function m(n){return n==null?'n/a':'$'+Math.round(n).toLocaleString('en-US');}
function m2(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function roas(rev,sp){return sp>0?rev/sp:null;}
function rx(v){return v==null?'n/a':v.toFixed(2)+'x';}
function val(r,k){
  if(k==='roas')return roas(r[4],r[5]);
  if(k==='roasp')return roas(r[7],r[5]);
  return r[+k];
}
function sorted(){
  var rs=D.rows[state.range].slice();
  rs.sort(function(a,b){
    var x=val(a,state.sort),y=val(b,state.sort);
    if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1;
    return (x-y)*state.dir;
  });
  return rs;
}
function drawRanges(){
  document.getElementById('ranges').innerHTML=RK.map(function(k){
    var r=D.ranges[k];
    return '<button data-r="'+k+'" class="'+(k===state.range?'on':'')+'"><strong>'+r.label+'</strong><span>'+r.dates+'</span></button>';
  }).join('');
  document.getElementById('hdrRange').textContent=D.ranges[state.range].label+' · '+D.ranges[state.range].dates;
}
function drawKpis(){
  var r=D.ranges[state.range],k=r.kpi;
  var t=[['Closed revenue',m(k.closed),'hero'],['Ad spend (listed ads)',m(k.spend),''],
         ['ROAS closed',rx(roas(k.closed,k.spend)),''],['Purchases',String(k.purch),''],
         ['Revenue potential',m(k.pot),''],['Sold revenue',m(k.sold),'']];
  document.getElementById('kpis').innerHTML=t.map(function(x){
    return '<div class="kpi '+x[2]+'"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>';}).join('');
}
function drawNote(){
  var r=D.ranges[state.range];
  var h='<p><b>Match rate '+r.match.toFixed(1)+'%</b> of closed revenue in this window ties to a specific Meta ad. '+
    'Unmatched: '+m2(r.unClosed)+' closed and '+m2(r.unPot)+' potential, from link-in-bio traffic, renamed or deleted ads, and visits where the UTM was stripped. Those rows are listed below rather than hidden.</p>'+
    '<p><b>Timing.</b> Revenue is credited to the date of the first click, not the date the job closed. Recently launched ads are structurally undervalued here, and short-window ROAS can look inflated because the spend that produced an older close sits outside the window.</p>';
  document.getElementById('note').innerHTML=h;
}
function drawCards(){
  var rs=sorted(),top=null;
  for(var i=0;i<rs.length;i++){var v=val(rs[i],state.sort); if(v!=null&&(top==null||v>top))top=v;}
  document.getElementById('cards').innerHTML=rs.map(function(r,i){
    var un=r[3]!=='matched';
    var thumb=r[0]?'<div class="thumb"><img loading="lazy" src="'+r[0]+'.jpg" alt=""></div>'
                  :'<div class="ph">No rendered preview<br>for this source</div>';
    var v=val(r,state.sort),pct=(top&&v!=null&&v>0)?Math.max(2,Math.round(v/top*100)):0;
    var st=[['Closed revenue',m2(r[4]),'hl'],['Spend in window',m2(r[5]),''],['Purchases',String(r[6]),''],
            ['ROAS closed',rx(roas(r[4],r[5])),''],['Revenue potential',m2(r[7]),''],['ROAS potential',rx(roas(r[7],r[5])),'']];
    return '<div class="card'+(un?' un':'')+'">'+thumb+'<div class="body">'+
      '<span class="rank">#'+(i+1)+'</span><h3>'+esc(r[1])+'</h3>'+(un?'<span class="tag">unmatched</span>':'')+
      '<div class="meta">'+esc(r[2])+(r[0]?' &middot; ad '+r[0]:'')+'</div>'+
      '<div class="stats">'+st.map(function(s){return '<div class="st '+s[2]+'"><div class="k">'+s[0]+'</div><div class="v">'+s[1]+'</div></div>';}).join('')+'</div>'+
      '<div class="prog"><i style="width:'+pct+'%"></i></div>'+
      '<div class="progl">'+pct+'% of the leading ad on this sort</div>'+
      '</div></div>';
  }).join('');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function drawTable(){
  var rs=sorted(),k=D.ranges[state.range].kpi;
  var cols=[['1','Ad'],['2','Campaign'],['4','Closed revenue'],['5','Spend in window'],['6','Purchases'],
            ['roas','ROAS closed'],['7','Revenue potential'],['roasp','ROAS potential']];
  var h='<table><thead><tr>'+cols.map(function(c){
    return '<th data-s="'+c[0]+'" class="'+(c[0]===state.sort?'on':'')+'">'+c[1]+(c[0]===state.sort?(state.dir<0?' ▾':' ▴'):'')+'</th>';}).join('')+'</tr></thead><tbody>'+
    rs.map(function(r){
      return '<tr class="'+(r[3]!=='matched'?'un':'')+'"><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+m2(r[4])+'</td><td>'+m2(r[5])+'</td><td>'+r[6]+'</td><td>'+rx(roas(r[4],r[5]))+'</td><td>'+m2(r[7])+'</td><td>'+rx(roas(r[7],r[5]))+'</td></tr>';
    }).join('')+'</tbody><tfoot><tr><td>Total</td><td>'+rs.length+' ads</td><td>'+m2(k.closed)+'</td><td>'+m2(k.spend)+'</td><td>'+k.purch+'</td><td>'+rx(roas(k.closed,k.spend))+'</td><td>'+m2(k.pot)+'</td><td>'+rx(roas(k.pot,k.spend))+'</td></tr></tfoot></table>';
  document.getElementById('tablewrap').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('thead th'),function(th){
    th.onclick=function(){setSort(th.getAttribute('data-s'));};});
}
function drawFoot(){
  var r=D.ranges[state.range];
  document.getElementById('foot').innerHTML=
    'Generated '+D.gen+'. Snapshot, not a live feed.<br>'+
    'Closed revenue, purchases (Searchlight paying customers) and revenue potential come from Searchlight, filtered to the Facebook attribution channel. Spend, ad names and creative come from Meta Ads, account 7432973210049134. Creative shown is a rendered ad preview captured at build time.<br>'+
    'Both ROAS columns divide by the Meta spend shown in the row, so the arithmetic is checkable on screen. They will not tie exactly to the ROAS Searchlight reports itself, which uses its internal spend allocation. Searchlight reports '+m2(r.kpi.acct)+' of Facebook spend for this window against the '+m2(r.kpi.spend)+' attributable to the ads listed here.<br>'+
    'Purchase columns inside Meta Ads Manager are not comparable to Searchlight paying customers, which count closed jobs in the CRM, so they are never mixed in one column.';
}
function draw(){drawRanges();drawKpis();drawNote();drawCards();drawTable();drawFoot();
  document.getElementById('dirBtn').textContent=state.dir<0?'Descending':'Ascending';
  document.getElementById('sortSel').value=state.sort;
  document.getElementById('cards').className=state.view==='cards'?'cards':'cards hide';
  document.getElementById('tablewrap').className=state.view==='table'?'tw':'tw hide';
  document.getElementById('tabCards').className=state.view==='cards'?'on':'';
  document.getElementById('tabTable').className=state.view==='table'?'on':'';
  Array.prototype.forEach.call(document.querySelectorAll('#ranges button'),function(b){
    b.onclick=function(){state.range=b.getAttribute('data-r');draw();};});
}
function setSort(s){ if(state.sort===s){state.dir=-state.dir;} else {state.sort=s;state.dir=-1;} draw(); }
document.getElementById('sortSel').onchange=function(){state.sort=this.value;state.dir=-1;draw();};
document.getElementById('dirBtn').onclick=function(){state.dir=-state.dir;draw();};
document.getElementById('tabCards').onclick=function(){state.view='cards';draw();};
document.getElementById('tabTable').onclick=function(){state.view='table';draw();};
draw();

</script>
