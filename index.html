const GEN = "September 5, 2026";
var RK=["d28","d90","ytd"];

var cur="d90", sortKey="closed", sortDir=-1, tableMode=false;
function money(n){return "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function money0(n){return "$"+Math.round(Number(n)).toLocaleString("en-US");}
function fdate(s){var p=s.split("-");return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1]+" "+(+p[2])+", "+p[0];}
function shortd(s){var p=s.split("-");return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1]+" "+(+p[2]);}
function val(a,k){
  var closed=a[4],spend=a[5],pur=a[6],pot=a[7];
  if(k==="closed")return closed;
  if(k==="spend")return spend;
  if(k==="purchases")return pur;
  if(k==="potential")return pot;
  if(k==="roas")return spend>0?closed/spend:null;
  if(k==="roasPot")return spend>0?pot/spend:null;
  return 0;
}
function fmt(k,v){
  if(v===null)return "n/a";
  if(k==="purchases")return String(v);
  if(k==="roas"||k==="roasPot")return v.toFixed(2)+"x";
  return money(v);
}
function sorted(){
  var ads=D[cur].ads.slice();
  ads.sort(function(a,b){
    var x=val(a,sortKey),y=val(b,sortKey);
    if(x===null&&y===null)return b[4]-a[4];
    if(x===null)return 1;
    if(y===null)return -1;
    if(x===y)return b[4]-a[4];
    return sortDir===-1?y-x:x-y;
  });
  return ads;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function renderRanges(){

}
function renderKpis(){

  var k=[["Closed revenue",money0(t.closed),1],["Ad spend (matched ads)",money0(t.adSpend),0],
         ["ROAS closed",roas,0],["Purchases",String(t.purchases),0],
         ["Revenue potential",money0(t.potential),0],["Sold revenue",money0(t.sold),0]];

}
function renderNote(){

    "<p><b>Timing lag.</b> Searchlight credits revenue to the date of the first click, not the date the job closed. Recently launched ads are structurally undervalued here, and ROAS in the shorter windows can read high because the spend that produced a close sits outside the window. Read the 90 day and year to date views before moving budget.</p>"+

function renderCards(){
  var ads=sorted(),top=0;

  document.getElementById("cards").innerHTML=ads.map(function(a,i){
    var thumb=a[0]?'<div class="thumb"><img loading="lazy" src="'+a[0]+'.jpg" alt=""></div>'
                  :'<div class="ph">No Meta creative<br>for this UTM</div>';

      return '<div class="st"><div class="k">'+esc(m[1])+'</div><div class="v">'+fmt(m[0],val(a,m[0]))+"</div></div>";

  }).join("");
}
function renderTable(){

  var roas=t.adSpend>0?(t.closed/t.adSpend).toFixed(2)+"x":"n/a";

  document.getElementById("tablewrap").innerHTML="<table><thead>"+head+"</thead><tbody>"+rows+tot+"</tbody></table>";

}
