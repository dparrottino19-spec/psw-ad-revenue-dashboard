var GEO={"1335x896":[998,-410,-7],"1400x856":[751,-286,-5],"1512x791":[1306,-564,-7],
         "1512x811":[986,-405,-9],"1516x784":[894,-358,-7]};
function fitThumb(img){var g=GEO[img.naturalWidth+'x'+img.naturalHeight];
 if(!g){var sc=178/(img.naturalWidth*0.178);
        g=[Math.round(img.naturalWidth*sc),Math.round(-img.naturalWidth*0.41*sc),-7];}
 img.style.width=g[0]+'px';img.style.left=g[1]+'px';img.style.top=g[2]+'px';img.className='fit';}
function fitAll(){[].forEach.call(document.querySelectorAll('.thumb img'),function(im){
 if(im.complete&&im.naturalWidth)fitThumb(im);
 else im.addEventListener('load',function(){fitThumb(im);},{once:true});});}

var RANGE='d90', VIEW='cards', SORT=4, DESC=true;
var COLS=[{k:4,t:'Closed revenue',m:'money'},{k:5,t:'Spend in window',m:'money'},
          {k:6,t:'Purchases',m:'int'},{k:'roas',t:'Return on ad spend',m:'x'},
          {k:7,t:'Revenue potential',m:'money'},{k:'roasp',t:'ROAS potential',m:'x'}];

function money(n){if(n===null||n===undefined)return 'n/a';
  return '$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});}
function fmt(a,c){
  if(c.k==='roas'){return a[5]?(a[4]/a[5]).toFixed(2)+'x':'n/a';}
  if(c.k==='roasp'){return a[5]?(a[7]/a[5]).toFixed(2)+'x':'n/a';}
  if(c.m==='money')return money(a[c.k]);
  return String(a[c.k]);
}
function val(a,c){
  if(c.k==='roas')return a[5]?a[4]/a[5]:-1;
  if(c.k==='roasp')return a[5]?a[7]/a[5]:-1;
  var v=a[c.k];return v===null?-1:v;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function sorted(){
  var c=COLS[SORT];
  var list=D[RANGE].ads.slice();
  list.sort(function(a,b){var x=val(a,c),y=val(b,c);return DESC?y-x:x-y;});
  return list;
}

function renderKPI(){
  var d=D[RANGE],k=d.kpi;
  var roas=k.spend?(k.closed/k.spend).toFixed(2)+'x':'n/a';
  var t=[['Closed revenue',money(k.closed),1],['Ad spend',money(k.spend),0],
         ['ROAS closed',roas,0],['Purchases',String(k.purchases),0],
         ['Revenue potential',money(k.potential),0],['Sold revenue',money(k.sold),0]];
  return t.map(function(x){return '<div class="kpi'+(x[2]?' hero':'')+'"><div class="kl">'+x[0]+
    '</div><div class="kv">'+x[1]+'</div></div>';}).join('');
}

function renderNote(){
  var d=D[RANGE],p=d.prov;
  var s='<p><b>Match rate '+d.match+'%.</b> '+money(d.nonAdClosed)+
    ' of closed revenue came from traffic that is not a paid ad and is listed separately below. '+
    money(d.goneClosed)+' came from ads that no longer exist under that name in the account, likely renamed or deleted.</p>';
  if(d.mergedCount>0) s+='<p>'+d.mergedCount+' row'+(d.mergedCount>1?'s':'')+
    ' cover more than one ad sharing the same name. Their spend is summed and the creative shown is the highest spender, because Searchlight cannot split revenue between two ads with identical names.</p>';
  s+='<p><b>Where spend comes from.</b> The Ad Spend figure above is account level spend from Meta for this window, '+
    money(p.acct)+'. Of that, '+money(p.listed)+' sits on the ads listed below; the rest went to ads that produced no tracked revenue, so the rows deliberately sum to less than the total. Searchlight reports '+
    money(p.sl)+' for the same window, which is its own internal allocation and is not used anywhere on this page.</p>';
  s+='<p><b>Revenue is credited to the date of the first click, not the date the job closed.</b> That means this view structurally undervalues recently launched ads, and short window ROAS can look inflated. Read the 90 day and year to date views together with the 28 day one.</p>';
  return s;
}

function renderCards(){
  var list=sorted(),c=COLS[SORT];
  var top=0;list.forEach(function(a){var v=val(a,c);if(v>top)top=v;});
  return list.map(function(a,i){
    var v=val(a,c),pct=top>0?Math.max(2,Math.round(v/top*100)):2;
    var badge='';
    if(a[9]>1) badge='<span class="bdg blue">'+a[9]+' ads share this name, spend summed</span>';
    else if(!a[3]) badge='<span class="bdg amber">'+esc(a[8])+'</span>';
    var img=a[0]?'<img src="'+a[0]+'.jpg" alt="">':'';
    var thumb=a[0]?'<div class="thumb">'+img+'</div>':'<div class="thumb ph"><span>'+esc(a[1])+'</span></div>';
    var stats=COLS.map(function(col){return '<div class="st'+(col===c?' on':'')+'"><div class="sl">'+col.t+
      '</div><div class="sv">'+fmt(a,col)+'</div></div>';}).join('');
    return '<div class="card">'+thumb+'<div class="cbody"><div class="chead"><span class="rank">'+(i+1)+
      '</span><div><div class="cname">'+esc(a[1])+'</div><div class="cmeta">'+esc(a[2])+
      (a[0]?' &middot; ad '+a[0]:'')+'</div></div></div>'+badge+
      '<div class="stats">'+stats+'</div><div class="bar"><span style="width:'+pct+'%"></span></div></div></div>';
  }).join('');
}

function renderTable(){
  var list=sorted();
  var head='<tr><th class="l">#</th><th class="l">Ad</th><th class="l">Campaign</th>'+
    COLS.map(function(col,i){return '<th class="sortable'+(i===SORT?' on':'')+'" data-i="'+i+'">'+col.t+
      (i===SORT?(DESC?' &darr;':' &uarr;'):'')+'</th>';}).join('')+'</tr>';
  var body=list.map(function(a,i){
    var tag='';
    if(a[9]>1) tag=' <span class="tag blue">merged</span>';
    else if(!a[3]) tag=' <span class="tag amber">no live ad</span>';
    return '<tr><td class="l">'+(i+1)+'</td><td class="l">'+esc(a[1])+tag+'</td><td class="l sm">'+esc(a[2])+
      '</td>'+COLS.map(function(col){return '<td>'+fmt(a,col)+'</td>';}).join('')+'</tr>';
  }).join('');
  var tc=0,ts=0,tp=0,tt=0;
  list.forEach(function(a){tc+=a[4];ts+=(a[5]||0);tp+=a[6];tt+=a[7];});
  var tot='<tr class="tot"><td class="l"></td><td class="l">Listed ads</td><td></td><td>'+money(tc)+
    '</td><td>'+money(ts)+'</td><td>'+tp+'</td><td>'+(ts?(tc/ts).toFixed(2)+'x':'n/a')+
    '</td><td>'+money(tt)+'</td><td>'+(ts?(tt/ts).toFixed(2)+'x':'n/a')+'</td></tr>';
  return '<table><thead>'+head+'</thead><tbody>'+body+tot+'</tbody></table>';
}

function renderNonAd(){
  var n=D[RANGE].nonad;
  if(!n.length) return '';
  return '<h2>Revenue not attributable to an ad</h2>'+
    '<p class="sub">These rows carry real revenue but no ad creative, so they are not ranked against the ads above. They still count toward the window totals.</p>'+
    '<table><thead><tr><th class="l">Source</th><th>Closed revenue</th><th>Revenue potential</th><th>Purchases</th><th class="l">Why</th></tr></thead><tbody>'+
    n.map(function(o){return '<tr><td class="l">'+esc(o[0])+'</td><td>'+money(o[1])+'</td><td>'+money(o[2])+
      '</td><td>'+o[3]+'</td><td class="l sm">'+esc(o[4])+'</td></tr>';}).join('')+'</tbody></table>';
}

function render(){
  var d=D[RANGE];
  document.getElementById('active').textContent=d.label+', '+d.dates;
  [].forEach.call(document.querySelectorAll('.rbtn'),function(b){
    b.className='rbtn'+(b.dataset.r===RANGE?' on':'');});
  [].forEach.call(document.querySelectorAll('.vbtn'),function(b){
    b.className='vbtn'+(b.dataset.v===VIEW?' on':'');});
  document.getElementById('kpis').innerHTML=renderKPI();
  document.getElementById('note').innerHTML=renderNote();
  var sc=document.getElementById('sortctl');
  sc.innerHTML='<span class="sortlab">Sort by</span>'+COLS.map(function(col,i){
    return '<button class="sbtn'+(i===SORT?' on':'')+'" data-i="'+i+'">'+col.t+
      (i===SORT?(DESC?' &darr;':' &uarr;'):'')+'</button>';}).join('');
  document.getElementById('out').innerHTML=VIEW==='cards'?renderCards():renderTable();
  document.getElementById('nonad').innerHTML=renderNonAd();
  document.getElementById('count').textContent=d.ads.length+' ads with closed revenue or open pipeline in this window';
  fitAll();
}

document.addEventListener('click',function(e){
  var t=e.target.closest('.rbtn,.vbtn,.sbtn,.sortable');
  if(!t)return;
  if(t.classList.contains('rbtn')){RANGE=t.dataset.r;render();return;}
  if(t.classList.contains('vbtn')){VIEW=t.dataset.v;render();return;}
  var i=parseInt(t.dataset.i,10);
  if(i===SORT)DESC=!DESC;else{SORT=i;DESC=true;}
  render();
});
render();
