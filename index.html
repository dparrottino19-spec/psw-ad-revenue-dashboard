function drawKpis(){
  var t=D[state.range].totals, sp=D[state.range].metaSpend;
  var k=[['Closed Revenue',m(t.closed),1],['Ad Spend',m(sp),0],['ROAS Closed',x(sp>0?t.closed/sp:null),0],
         ['Purchases',String(t.purchases),0],['Revenue Potential',m(t.potential),0],['Sold Revenue',m(t.sold),0]];
  document.getElementById('kpis').innerHTML=k.map(function(a){
    return '<div class="kpi'+(a[2]?' hero':'')+'"><div class="k">'+a[0]+'</div><div class="v">'+a[1]+'</div></div>';
  }).join('');
}
function drawNote(){
  var d=D[state.range], mt=d.matched, un=d.unmatched;
  var rate=Math.round(mt.closed/d.totals.closed*1000)/10;
  document.getElementById('note').innerHTML=
   '<p><b>Match rate '+rate+' percent.</b> '+m2(mt.closed)+' of '+m2(d.totals.closed)+
   ' in closed revenue resolves to a specific ad. '+m2(un.closed)+' across '+un.groups+
   ' tracking groups does not, because the UTM was stripped, the click came from a link in bio or halo spend, or the ad name no longer resolves to exactly one live ad. Unmatched revenue is left out of the ad list rather than guessed at.</p>'+
   '<p><b>Timing.</b> Revenue is credited to the date of the first click, not the date the job closed. Recently launched ads are therefore structurally undervalued here, and ROAS in the shorter windows can look inflated. Revenue Potential includes pipeline that is still open.</p>';
}
function drawSorts(){
  document.getElementById('sorts').innerHTML=MET.map(function(o){
    return '<button data-s="'+o.k+'" class="'+(o.k===state.sort?'on':'')+'">'+o.t+(o.k===state.sort?(state.dir===-1?' \u2193':' \u2191'):'')+'</button>';
  }).join(' ');
}
function drawCards(){
  var list=sorted(state.range);
  var mk=state.sort;
  var top=0;
  list.forEach(function(r){var v=r[mk];if(v!==null&&v>top)top=v;});
  var cur=MET.filter(function(o){return o.k===mk;})[0];
  document.getElementById('cards').innerHTML=list.map(function(r,i){
    var v=r[mk], pct=(top>0&&v!==null)?Math.max(1.5,v/top*100):0;
    var tiles=MET.map(function(o){
      return '<div class="tile'+(o.k===mk?' on':'')+'"><div class="k">'+o.t+'</div><div class="v">'+fmt(r[o.k],o.f)+'</div></div>';
    }).join('');
    return '<div class="card">'+
      '<div class="thumb"><img loading="lazy" src="'+r.id+'.jpg" alt=""></div>'+
      '<div class="cbody"><div class="chead"><span class="rank">'+(i+1)+'</span>'+
      '<div><div class="cname">'+esc(r.name)+'</div>'+
      '<div class="cmeta">'+esc(r.camp)+' &middot; '+r.type+' &middot; Ad '+r.id+'</div></div></div>'+
      '<div class="tiles">'+tiles+'</div>'+
      '<div class="meter"><div class="track"><div class="fill" style="width:'+pct+'%"></div></div>'+
      '<div class="cap">'+cur.t+' versus the top ad in this view</div></div>'+
      '</div></div>';
  }).join('');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function drawTable(){
  var list=sorted(state.range);
  var head='<tr><th>#</th><th>Ad</th><th>Campaign</th>'+MET.map(function(o){
    return '<th data-s="'+o.k+'" class="'+(o.k===state.sort?'on':'')+'">'+o.t+(o.k===state.sort?(state.dir===-1?' \u2193':' \u2191'):'')+'</th>';
  }).join('')+'</tr>';
  var body=list.map(function(r,i){
    return '<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.camp)+'</td>'+
      MET.map(function(o){return '<td>'+fmt(r[o.k],o.f)+'</td>';}).join('')+'</tr>';
  }).join('');
  var tc=0,ts=0,tp=0,tq=0;
  list.forEach(function(r){tc+=r.closed;ts+=r.spend;tp+=r.purchases;tq+=r.potential;});
  var foot='<tr><td></td><td>Total, matched ads</td><td></td><td>'+m(tc)+'</td><td>'+m(ts)+'</td><td>'+tp+'</td><td>'+
    x(ts>0?tc/ts:null)+'</td><td>'+m(tq)+'</td><td>'+x(ts>0?tq/ts:null)+'</td></tr>';
  document.getElementById('table').innerHTML='<table><thead>'+head+'</thead><tbody>'+body+'</tbody><tfoot>'+foot+'</tfoot></table>';
}
function drawFoot(){
  var d=D[state.range];
  document.getElementById('foot').innerHTML=
   'Snapshot generated '+D.meta.generated+'. This page is a snapshot, not a live feed.<br>'+
   'Closed revenue, purchases and revenue potential come from Searchlight, Meta Performance By, Facebook attribution channel. Purchases are Searchlight Paying Customers, which are closed jobs from the CRM, not Meta Ads Manager purchase events. The two will never agree and are not mixed here.<br>'+
   'Spend, ad names and creative come from the Meta Ads account. Both ROAS columns divide by the Meta spend shown on screen, so the arithmetic is checkable. This will not tie exactly to Searchlight own ROAS, which uses its internal spend allocation. Searchlight reported '+m2(d.totals.spend)+' of spend for this window against '+m2(d.metaSpend)+' in Meta.<br>'+
   'Every ad with closed revenue or open pipeline above zero is shown, including recently launched ads that have not closed a job yet.<br>'+
   'Prepared by Parrottino Digital.';
}
function render(){drawRanges();drawKpis();drawNote();drawSorts();drawCards();drawTable();drawFoot();
  document.getElementById('cards').className=state.view==='cards'?'':'hide';
  document.getElementById('table').className=state.view==='table'?'':'hide';
  document.getElementById('vCards').className=state.view==='cards'?'on':'';
  document.getElementById('vTable').className=state.view==='table'?'on':'';
}
function setSort(k){if(state.sort===k){state.dir=state.dir*-1;}else{state.sort=k;state.dir=-1;}render();}
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-r],[data-s],#vCards,#vTable'):null;
  if(!t)return;
  if(t.dataset&&t.dataset.r){state.range=t.dataset.r;render();return;}
  if(t.dataset&&t.dataset.s){setSort(t.dataset.s);return;}
  if(t.id==='vCards'){state.view='cards';render();return;}
  if(t.id==='vTable'){state.view='table';render();return;}
});
render();
</script>
</body>
</html>
