const M=[["closed","Closed revenue",4],["spend","Spend in window",5],["purch","Purchases",6],["roas","Return on ad spend",-1],["pot","Revenue potential",7],["roasp","ROAS potential",-2]];
let R="90d",S="closed",DESC=true,TBL=false;
const money=n=>"$"+Math.round(n).toLocaleString("en-US");
const money2=n=>"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const roas=(r,i)=>r[5]>0?(r[i]/r[5]):null;
const rtxt=v=>v===null?"n/a":v.toFixed(1)+"x";
const val=(r,k)=>k==="roas"?roas(r,4):k==="roasp"?roas(r,7):r[M.find(m=>m[0]===k)[2]];
const fmtDate=s=>{const[y,m,d2]=s.split("-").map(Number);return new Date(y,m-1,d2).toLocaleDateString("en-US",{month:"short",day:"numeric"})};
function sorted(){const a=D[R].ads.slice();a.sort((x,y)=>{let vx=val(x,S),vy=val(y,S);if(vx===null)vx=-1;if(vy===null)vy=-1;return DESC?vy-vx:vx-vy});return a}
function drawRange(){document.getElementById("rangeBar").innerHTML=["28d","90d","ytd"].map(k=>`<button data-r="${k}" class="${k===R?"on":""}">${D[k].label}<small>${fmtDate(D[k].start)} to ${fmtDate(D[k].end)}</small></button>`).join("");
document.querySelectorAll("#rangeBar button").forEach(b=>b.onclick=()=>{R=b.dataset.r;draw()});}
function drawSort(){document.getElementById("sortBtns").innerHTML=M.map(m=>`<button data-s="${m[0]}" class="${m[0]===S?"on":""}">${m[1]}${m[0]===S?(DESC?" \u25bc":" \u25b2"):""}</button>`).join(" ");
document.querySelectorAll("#sortBtns button").forEach(b=>b.onclick=()=>{if(S===b.dataset.s)DESC=!DESC;else{S=b.dataset.s;DESC=true}draw()});}
function drawKpi(){const d=D[R];const rc=d.spend>0?d.closed/d.spend:null;
document.getElementById("hdrRange").textContent=d.label+" \u00b7 "+fmtDate(d.start)+" to "+fmtDate(d.end);
document.getElementById("kpis").innerHTML=[["hero","Closed revenue",money(d.closed)],["","Ad spend",money(d.spend)],["","ROAS closed",rtxt(rc)],["","Purchases",String(d.purch)],["","Revenue potential",money(d.pot)],["","Sold revenue",money(d.sold)]].map(k=>`<div class="kpi ${k[0]}"><div class="k">${k[1]}</div><div class="v">${k[2]}</div></div>`).join("");
document.getElementById("note").innerHTML=`<p><b>Match rate ${d.matchRate}% of closed revenue.</b> ${money2(d.unClosed)} closed and ${money2(d.unPot)} of revenue potential could not be tied to a live Meta ad in this window. That is traffic with no utm_content (direct visits, phone calls and stripped links), Instagram bio link clicks, and ads that have since been deleted or renamed in Ads Manager. Those rows stay listed below rather than being hidden.</p><p><b>Revenue is credited to the date of the first click, not the date the job closed.</b> Jobs take weeks to close, so this view structurally undervalues recently launched ads, and ROAS in the short window can look inflated. Read the 90 day and year to date views before making budget calls.</p>`;}
function drawCards(){const a=sorted();const top=a.length?Math.max(...a.map(r=>{const v=val(r,S);return v===null?0:v})):0;
document.getElementById("cards").innerHTML=a.map((r,i)=>{const rc=roas(r,4),rp=roas(r,7);const v=val(r,S),pct=top>0&&v!==null&&v>0?Math.max(2,Math.round(100*v/top)):0;
const img=r[0]?`<div class="thumb"><img src="${r[0]}.jpg" loading="lazy" alt=""></div>`:`<div class="ph">No live Meta ad matched<br><br>${esc(r[1])}</div>`;
const lbl=M.find(m=>m[0]===S)[1];
const vt=S==="purch"?String(v):(S==="roas"||S==="roasp")?rtxt(v):money(v||0);
return `<div class="card">${img}<div class="meat"><span class="rank">#${i+1}</span><span class="nm">${esc(r[1])}</span>
<div class="sub2">${esc(r[2])}${r[0]?" &middot; Ad ID "+r[0]:' &middot; <span class="um">Unmatched</span>'}</div>
<div class="tiles">
<div class="tile ${S==="closed"?"hi":""}"><div class="k">Closed revenue</div><div class="v">${money2(r[4])}</div></div>
<div class="tile ${S==="spend"?"hi":""}"><div class="k">Spend in window</div><div class="v">${r[0]?money2(r[5]):"n/a"}</div></div>
<div class="tile ${S==="purch"?"hi":""}"><div class="k">Purchases</div><div class="v">${r[6]}</div></div>
<div class="tile ${S==="roas"?"hi":""}"><div class="k">Return on ad spend</div><div class="v">${rtxt(rc)}</div></div>
<div class="tile ${S==="pot"?"hi":""}"><div class="k">Revenue potential</div><div class="v">${money2(r[7])}</div></div>
<div class="tile ${S==="roasp"?"hi":""}"><div class="k">ROAS potential</div><div class="v">${rtxt(rp)}</div></div>
</div>
<div class="barw"><div class="barf" style="width:${pct}%"></div></div>
<div class="barl">${lbl}: ${vt}${top>0&&v!==null&&i>0?" \u00b7 "+Math.round(100*v/top)+"% of the top ad":""}</div>
</div></div>`}).join("");}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function drawTable(){const a=sorted();
const th=["Ad","Campaign",...M.map(m=>m[1])];
const tc=a.reduce((s,r)=>s+r[4],0),ts=a.reduce((s,r)=>s+r[5],0),tp2=a.reduce((s,r)=>s+r[6],0),tpo=a.reduce((s,r)=>s+r[7],0);
document.getElementById("table").innerHTML=`<table><thead><tr>${th.map((t,i)=>{const k=i>=2?M[i-2][0]:null;return `<th ${k?`data-s="${k}" class="${k===S?"on":""}"`:""}>${t}${k===S?(DESC?" \u25bc":" \u25b2"):""}</th>`}).join("")}</tr></thead><tbody>${a.map(r=>`<tr class="${r[0]?"":"um"}"><td>${esc(r[1])}${r[0]?"":" (unmatched)"}</td><td>${esc(r[2])}</td><td>${money2(r[4])}</td><td>${r[0]?money2(r[5]):"n/a"}</td><td>${r[6]}</td><td>${rtxt(roas(r,4))}</td><td>${money2(r[7])}</td><td>${rtxt(roas(r,7))}</td></tr>`).join("")}</tbody>
<tfoot><tr><td>Total (${a.length} ads)</td><td></td><td>${money2(tc)}</td><td>${money2(ts)}</td><td>${tp2}</td><td>${ts>0?rtxt(tc/ts):"n/a"}</td><td>${money2(tpo)}</td><td>${ts>0?rtxt(tpo/ts):"n/a"}</td></tr></tfoot></table>`;
document.querySelectorAll("#table th[data-s]").forEach(h=>h.onclick=()=>{if(S===h.dataset.s)DESC=!DESC;else{S=h.dataset.s;DESC=true}draw()});}
function draw(){drawRange();drawSort();drawKpi();drawCards();drawTable();
document.getElementById("cards").className=TBL?"hide":"";
document.getElementById("table").className=TBL?"":"hide";
document.getElementById("viewBtn").textContent=TBL?"Card view":"Table view";
document.getElementById("foot").innerHTML=`<b>Generated September 4, 2026.</b> This page is a snapshot, not a live feed. Closed revenue, purchases (Searchlight paying customers, meaning closed deals rather than unique leads) and revenue potential come from Searchlight, Meta Performance By, Facebook attribution channel. Spend, ad names and creative come from the Meta Ads API, account 7432973210049134. Both ROAS columns divide by the Meta spend shown on screen, so the math is checkable, and they will not tie exactly to Searchlight's own ROAS, which uses its internal spend allocation. The ad spend KPI is the Searchlight window total for the channel, which includes spend on ads that produced no attributed revenue. Meta's own purchase columns will never match this page, because Searchlight counts closed jobs from the CRM. Creative shown is a rendered mobile feed preview of each ad.`;}
document.getElementById("viewBtn").onclick=()=>{TBL=!TBL;draw()};
draw();
</script>
