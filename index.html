var RANGES=[["28d",L28],["90d",L90],["ytd",LYT]];
var state={r:"90d",sort:"closed",dir:-1,view:"cards"};
var M=[["closed","Closed revenue"],["spend","Spend in window"],["purch","Purchases"],["roas","Return on ad spend"],["pot","Revenue potential"],["roasPot","ROAS potential"]];
function money(v){if(v===null||v===undefined)return "n/a";return "$"+v.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0});}
function money2(v){if(v===null||v===undefined)return "n/a";return "$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function roas(rev,sp){if(sp===null||sp===undefined||sp<=0)return null;return rev/sp;}
function rx(v){return v===null?"n/a":v.toFixed(2)+"x";}
function rows(){
  var a=D[state.r].ads.map(function(x){
    var o={id:x[0],name:x[1],camp:x[2],matched:x[3]===1,closed:x[4],spend:x[5],purch:x[6],pot:x[7],why:x[8]};
    o.roas=roas(o.closed,o.spend); o.roasPot=roas(o.pot,o.spend); return o;});
  var k=state.sort,d=state.dir;
  a.sort(function(p,q){
    var x=p[k],y=q[k];
    if(x===null||x===undefined)x=-1; if(y===null||y===undefined)y=-1;
    if(x===y)return q.closed-p.closed; return (x<y?-1:1)*d;});
  return a;
}
function drawRanges(){
  var h="";RANGES.forEach(function(r){h+='<button data-r="'+r[0]+'" aria-pressed="'+(state.r===r[0])+'"><b>'+r[1][0]+'</b>'+r[1][1]+'</button>';});
  document.getElementById("ranges").innerHTML=h;
  document.getElementById("hdrRange").textContent=RANGES.filter(function(r){return r[0]===state.r})[0][1].join(" · ");
  [].forEach.call(document.querySelectorAll("#ranges button"),function(b){b.onclick=function(){state.r=b.dataset.r;draw();};});
}
function drawSorts(){
  var e=document.getElementById("sorts");e.innerHTML='<span>Sort by</span>';
  M.forEach(function(m){var b=document.createElement("button");b.textContent=m[1];
    b.setAttribute("aria-pressed",state.sort===m[0]);
    b.onclick=function(){if(state.sort===m[0]){state.dir=-state.dir;}else{state.sort=m[0];state.dir=-1;}draw();};
    e.appendChild(b);});
}
function drawKpis(){
  var k=D[state.r].kpi;var r=roas(k.closed,k.spend);
  var items=[["Closed revenue",money(k.closed),1],["Ad spend",money(k.spend),0],["ROAS closed",rx(r),0],
             ["Purchases",String(k.purch),0],["Revenue potential",money(k.pot),0],["Sold revenue",money(k.sold),0]];
  document.getElementById("kpis").innerHTML=items.map(function(i){
    return '<div class="kpi'+(i[2]?" hero":"")+'"><div class="l">'+i[0]+'</div><div class="v">'+i[1]+'</div></div>';}).join("");
}
function drawNote(){
  var m=D[state.r].match;
  document.getElementById("note").innerHTML=
   '<b>'+m.closedPct.toFixed(1)+'% of closed revenue is matched to a specific ad</b> in this window ('+money2(m.unClosed)+
   ' closed and '+money2(m.unPot)+' of potential could not be tied to exactly one live ad). Unmatched rows stay listed below with the reason, and are included in the totals above. '+
   'Causes are duplicate ad names inside one campaign, ads renamed or deleted since the click, link_in_bio traffic, and Searchlight rows with no utm_content. '+
   '<b>Revenue is credited to the date of the first click, not the date the job closed</b>, so recently launched ads are structurally undervalued here and short-window ROAS can look inflated.';
}
function drawCards(){
  var a=rows(),k=state.sort;
  var top=0;a.forEach(function(x){var v=x[k];if(v!==null&&v>top)top=v;});
  var h=a.map(function(x,i){
    var img=x.matched&&x.id?'<div class="thumb"><img loading="lazy" src="'+x.id+'.jpg" alt=""></div>'
                           :'<div class="ph">'+esc(x.name)+'<br><br>no creative available</div>';
    var v=x[k];var pct=(top>0&&v!==null&&v>0)?Math.round(v/top*100):0;
    var tiles=[["Closed revenue",money2(x.closed)],["Spend in window",x.spend===null?"n/a":money2(x.spend)],
               ["Purchases",String(x.purch)],["ROAS closed",rx(x.roas)],
               ["Revenue potential",money2(x.pot)],["ROAS potential",rx(x.roasPot)]];
    return '<div class="card">'+img+'<div class="body"><span class="rank">'+(i+1)+'</span><span class="nm">'+esc(x.name)+'</span>'+
      (x.matched?'':'<span class="um">unmatched: '+esc(x.why)+'</span>')+
      '<div class="meta">'+esc(x.camp)+(x.matched?' &middot; ad '+x.id:'')+'</div>'+
      '<div class="tiles">'+tiles.map(function(t){return '<div class="tile"><div class="l">'+t[0]+'</div><div class="v">'+t[1]+'</div></div>';}).join("")+'</div>'+
      '<div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div></div>';}).join("");
  document.getElementById("cards").innerHTML=h;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function drawTable(){
  var a=rows(),k=D[state.r].kpi;
  var cols=[["name","Ad"],["camp","Campaign"],["closed","Closed revenue"],["spend","Spend in window"],
            ["purch","Purchases"],["roas","ROAS closed"],["pot","Revenue potential"],["roasPot","ROAS potential"]];
  var h='<table><thead><tr>'+cols.map(function(c){
     var on=(c[0]===state.sort)?' data-on="1"':'';
     return '<th data-k="'+c[0]+'"'+on+'>'+c[1]+(c[0]===state.sort?(state.dir<0?" ▼":" ▲"):"")+'</th>';}).join("")+'</tr></thead><tbody>';
  a.forEach(function(x){
    h+='<tr><td>'+esc(x.name)+(x.matched?'':' <span class="um">unmatched</span>')+'</td><td>'+esc(x.camp)+'</td><td>'+money2(x.closed)+
       '</td><td>'+(x.spend===null?"n/a":money2(x.spend))+'</td><td>'+x.purch+'</td><td>'+rx(x.roas)+
       '</td><td>'+money2(x.pot)+'</td><td>'+rx(x.roasPot)+'</td></tr>';});
  h+='<tr class="tot"><td>Total (Searchlight)</td><td></td><td>'+money2(k.closed)+'</td><td>'+money2(k.spend)+'</td><td>'+k.purch+
     '</td><td>'+rx(roas(k.closed,k.spend))+'</td><td>'+money2(k.pot)+'</td><td>'+rx(roas(k.pot,k.spend))+'</td></tr>';
  h+='</tbody></table>';
  document.getElementById("table").innerHTML=h;
  [].forEach.call(document.querySelectorAll("#table th"),function(t){
    t.onclick=function(){var kk=t.dataset.k;if(kk==="name"||kk==="camp")return;
      if(state.sort===kk){state.dir=-state.dir;}else{state.sort=kk;state.dir=-1;}draw();};});
}
function drawFoot(){
  var d=D[state.r];
  document.getElementById("foot").innerHTML=
   'Window '+d.start+' to '+d.end+'. Generated '+GEN+'. This page is a snapshot, not a live feed.<br>'+
   'Closed revenue, purchases (Searchlight paying customers) and revenue potential come from Searchlight, Meta Performance By, Facebook attribution channel. Spend, ad names and creative come from Meta ad account 7432973210049134.<br>'+
   'Both ROAS columns divide by the Meta spend shown on screen, so the arithmetic is checkable. They will not tie exactly to Searchlight’s own ROAS, which uses its internal spend allocation. Purchases are closed jobs from the CRM and will never match Ads Manager purchase counts.';
}
function draw(){drawRanges();drawSorts();drawKpis();drawNote();drawCards();drawTable();drawFoot();
  document.getElementById("cards").className=state.view==="cards"?"":"hide";
  document.getElementById("table").className=state.view==="table"?"":"hide";
  document.getElementById("vCards").setAttribute("aria-pressed",state.view==="cards");
  document.getElementById("vTable").setAttribute("aria-pressed",state.view==="table");}
document.getElementById("vCards").onclick=function(){state.view="cards";draw();};
document.getElementById("vTable").onclick=function(){state.view="table";draw();};
draw();

</script>
