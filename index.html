var RANGE_LABELS={"28d":"Last 28 days","90d":"Last 90 days","ytd":"Year to date"};
var ORDER=["28d","90d","ytd"];
var cur="90d", sortKey="4", desc=true, tableMode=false;
function money(n){return "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function money0(n){return "$"+Number(n).toLocaleString("en-US",{maximumFractionDigits:0});}
function roas(rev,sp){return sp>0?(rev/sp).toFixed(2)+"x":"n/a";}
function fmtDate(s){var p=s.split("-");var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return m[+p[1]-1]+" "+(+p[2])+", "+p[0];}
function val(a,k){
  if(k==="roas"){return a[5]>0?a[4]/a[5]:-1;}
  if(k==="roasp"){return a[5]>0?a[7]/a[5]:-1;}
  return a[+k];
}
function sorted(){
  var a=D[cur].ads.slice();
  a.sort(function(x,y){var d=val(y,sortKey)-val(x,sortKey);return desc?d:-d;});
  return a;
}
function renderRanges(){
  var h="";
  ORDER.forEach(function(r){
    h+='<button data-r="'+r+'" class="'+(r===cur?"on":"")+'"><b>'+RANGE_LABELS[r]+'</b>'+fmtDate(D[r].start)+" to "+fmtDate(D[r].end)+"</button>";
  });
  document.getElementById("ranges").innerHTML=h;
  [].forEach.call(document.querySelectorAll("#ranges button"),function(b){
    b.onclick=function(){cur=b.getAttribute("data-r");renderAll();};
  });
}
function renderKpis(){
  var k=D[cur].kpi;
  var items=[
    ["Closed revenue",money0(k.closed),true],
    ["Ad spend",money0(k.spend),false],
    ["ROAS closed",roas(k.closed,k.spend),false],
    ["Purchases",String(k.pur),false],
    ["Revenue potential",money0(k.pot),false],
    ["Sold revenue",money0(k.sold),false]
  ];
  document.getElementById("kpis").innerHTML=items.map(function(i){
    return '<div class="kpi'+(i[2]?" hero":"")+'"><div class="l">'+i[0]+'</div><div class="v">'+i[1]+"</div></div>";
  }).join("");
  document.getElementById("hdrRange").textContent=RANGE_LABELS[cur];
  document.getElementById("hdrDates").textContent=fmtDate(D[cur].start)+" to "+fmtDate(D[cur].end);
}
function renderNote(){
  var d=D[cur];
  document.getElementById("note").innerHTML=
    "<b>"+d.matchPct.toFixed(1)+"% of closed revenue is tied to a specific ad creative.</b> "+
    "The remaining "+money(d.umClosed)+" closed and "+money(d.umPot)+" in potential could not be traced to one live ad: link in bio traffic, "+
    "organic and referral clicks with no utm_content, deleted ads, and a few cases where two live ads share the same name inside one campaign. "+
    "Those rows stay in the table below, greyed out, rather than being dropped or reassigned. "+
    "<br><br><b>Read the short windows carefully.</b> Revenue is credited to the date of the first click, not the date the job closed. "+
    "That structurally undervalues ads launched recently, and it can inflate ROAS in the shorter windows. The 90 day view is the default for that reason.";
}
function renderCards(){
  var rows=sorted(), top=Math.max.apply(null,rows.map(function(a){var v=val(a,sortKey);return v>0?v:0;}))||1;
  document.getElementById("cards").innerHTML=rows.map(function(a,i){
    var v=val(a,sortKey), pct=v>0?Math.round(100*v/top):0;
    var img=a[3]==="m"&&a[0]?'<div class="thumb"><img loading="lazy" src="'+a[0]+'.jpg" alt=""></div>'
                            :'<div class="thumb"><div class="ph">No matched ad creative</div></div>';
    return '<div class="card">'+img+'<div class="meta">'+
      '<span class="rank'+(a[3]==="m"?"":" um")+'">#'+(i+1)+(a[3]==="m"?"":" &middot; unmatched")+'</span>'+
      '<div class="nm">'+esc(a[1])+'</div>'+
      '<div class="cp">'+esc(a[2])+(a[0]?" &middot; "+a[0]:"")+'</div>'+
      '<div class="tiles">'+
        tile("Closed",money0(a[4]))+tile("Spend",money0(a[5]))+tile("Purch.",String(a[6]))+
        tile("ROAS",roas(a[4],a[5]))+tile("Potential",money0(a[7]))+tile("ROAS pot.",roas(a[7],a[5]))+
      '</div><div class="prog"><i style="width:'+pct+'%"></i></div></div></div>';
  }).join("");
}
function tile(l,v){return '<div class="t"><div class="l">'+l+'</div><div class="v">'+v+"</div></div>";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function renderTable(){
  var rows=sorted(), cols=[["1","Ad"],["2","Campaign"],["4","Closed revenue"],["5","Spend"],["6","Purchases"],["roas","ROAS"],["7","Revenue potential"],["roasp","ROAS potential"]];
  var h='<table><thead><tr>'+cols.map(function(c){
    return '<th data-k="'+c[0]+'" class="'+(c[0]===sortKey?"act":"")+'">'+c[1]+(c[0]===sortKey?(desc?" \u25bc":" \u25b2"):"")+"</th>";
  }).join("")+"</tr></thead><tbody>";
  rows.forEach(function(a){
    h+='<tr class="'+(a[3]==="m"?"":"um")+'"><td>'+esc(a[1])+'</td><td>'+esc(a[2])+"</td><td>"+money(a[4])+"</td><td>"+money(a[5])+"</td><td>"+a[6]+"</td><td>"+roas(a[4],a[5])+"</td><td>"+money(a[7])+"</td><td>"+roas(a[7],a[5])+"</td></tr>";
  });
  var tc=rows.reduce(function(s,a){return s+a[4];},0), ts=rows.reduce(function(s,a){return s+a[5];},0),
      tp=rows.reduce(function(s,a){return s+a[6];},0), tv=rows.reduce(function(s,a){return s+a[7];},0);
  h+='</tbody><tfoot><tr><td>Total ('+rows.length+' ads)</td><td></td><td>'+money(tc)+"</td><td>"+money(ts)+"</td><td>"+tp+"</td><td>"+roas(tc,ts)+"</td><td>"+money(tv)+"</td><td>"+roas(tv,ts)+"</td></tr></tfoot></table>";
  document.getElementById("tableWrap").innerHTML=h;
  [].forEach.call(document.querySelectorAll("#tableWrap th"),function(th){
    th.onclick=function(){var k=th.getAttribute("data-k");if(k===sortKey){desc=!desc;}else{sortKey=k;desc=true;}syncBar();renderCards();renderTable();};
  });
}
function syncBar(){
  var s=document.getElementById("sortSel");
  if([].some.call(s.options,function(o){return o.value===sortKey;})){s.value=sortKey;}
  document.getElementById("dirBtn").textContent=desc?"Descending":"Ascending";
}
function renderFoot(){
  document.getElementById("foot").innerHTML=
    "Generated <b>August 29, 2026</b>. This page is a snapshot, not a live feed."+
    "<br>Closed revenue, purchases and revenue potential come from Searchlight (Facebook attribution channel, closed and completed jobs). "+
    "Spend, ad names and creative come from Meta Ads. Both ROAS columns divide by the Meta spend shown on this page, so the arithmetic is checkable; "+
    "it will not tie exactly to Searchlight's own ROAS, which uses its internal spend allocation. "+
    "Meta's own purchase columns count pixel events and will never match Searchlight, which counts closed jobs from the CRM. Only one of the two is on this page.";
}
function renderAll(){renderRanges();renderKpis();renderNote();syncBar();renderCards();renderTable();renderFoot();
  document.getElementById("cards").className=tableMode?"cards hide":"cards";
  document.getElementById("tableWrap").className=tableMode?"":"hide";
  document.getElementById("viewBtn").textContent=tableMode?"Show cards":"Show table";
}
document.getElementById("sortSel").onchange=function(){sortKey=this.value;desc=true;syncBar();renderCards();renderTable();};
document.getElementById("dirBtn").onclick=function(){desc=!desc;syncBar();renderCards();renderTable();};
document.getElementById("viewBtn").onclick=function(){tableMode=!tableMode;renderAll();};
renderAll();
</script>
