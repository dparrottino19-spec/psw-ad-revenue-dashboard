const RG=['28','90','ytd'];
const M=[['closed','Closed revenue'],['spend','Spend in window'],['pay','Purchases'],
         ['roas','Return on ad spend'],['pot','Revenue potential'],['roasPot','ROAS potential']];
let range='90', sortKey='closed', desc=true, view='cards';
const usd=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
const usd2=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const A=r=>({id:r[0],name:r[1],camp:r[2],type:r[3],closed:r[4],spend:r[5],pay:r[6],pot:r[7],
             roas:r[5]>0?r[4]/r[5]:null, roasPot:r[5]>0?r[7]/r[5]:null});
const val=(a,k)=>{const v=a[k];return v===null||v===undefined?-1:v;};
const fmt=(a,k)=>{
  if(k==='pay')return String(a.pay);
  if(k==='roas'||k==='roasPot'){const v=a[k];return v===null?'n/a':v.toFixed(2)+'x';}
  return usd(a[k]);
};
function rows(){const rs=D[range].ads.map(A);
  rs.sort((x,y)=>{const d=val(y,sortKey)-val(x,sortKey);return desc?d:-d;});return rs;}

function drawRanges(){
  document.getElementById('ranges').innerHTML=RG.map(r=>
    `<button class="rbtn${r===range?' on':''}" data-r="${r}"><b>${D[r].label}</b><span>${D[r].dates}</span></button>`).join('');
  document.getElementById('hdrRange').textContent=D[range].label+' · '+D[range].dates;
}
function drawKpis(){
  const d=D[range];
  const roas=d.spend>0?(d.closed/d.spend).toFixed(2)+'x':'n/a';
  const k=[['hero','Closed revenue',usd(d.closed)],['','Ad spend',usd(d.spend)],['','ROAS closed',roas],
           ['','Purchases',String(d.pay)],['','Revenue potential',usd(d.pot)],['','Sold revenue',usd(d.sold)]];
  document.getElementById('kpis').innerHTML=k.map(x=>
    `<div class="kpi ${x[0]}"><div class="k">${x[1]}</div><div class="v">${x[2]}</div></div>`).join('');
}
function drawNote(){
  const d=D[range];
  document.getElementById('note').innerHTML=
    `<b>Match rate ${d.matchRate}%.</b> ${usd2(d.unClosed)} of closed revenue and ${usd2(d.unPot)} of revenue potential in this window could not be tied to a single Meta ad. Those rows stay in the list, marked Unmatched. Causes are duplicate ad names inside one campaign, stripped or missing utm_content, and link_in_bio traffic.
     <p><b>Read the short window with care.</b> Revenue is credited to the date of the first click, not the date the job closed. That structurally undervalues recently launched ads and can inflate ROAS over short windows. The 90 day view is the default for ranking creative.</p>`;
}
function drawSort(){
  document.getElementById('sortSel').innerHTML=M.map(m=>
    `<option value="${m[0]}"${m[0]===sortKey?' selected':''}>${m[1]}</option>`).join('');
  document.getElementById('dirBtn').textContent=desc?'High to low':'Low to high';
}
function drawCards(){
  const rs=rows();
  const top=Math.max(...rs.map(a=>Math.max(0,val(a,sortKey))),0);
  document.getElementById('cards').innerHTML=rs.map((a,i)=>{
    const img=a.id?`<div class="thumb"><img loading="lazy" src="${a.id}.jpg" alt=""></div>`
                  :`<div class="ph">${a.name}<br><br>no matched creative</div>`;
    const pct=top>0?Math.max(0,val(a,sortKey))/top*100:0;
    const tiles=M.map(m=>`<div class="tile"><div class="k">${m[1]}</div><div class="v">${fmt(a,m[0])}</div></div>`).join('');
    return `<div class="card">${img}<div class="meta">
      <span class="rank">#${i+1}</span><span class="nm">${a.name}</span>${a.type==='unmatched'?'<span class="tag">Unmatched</span>':''}
      <div class="sub2">${a.camp}${a.id?' · ad '+a.id:''}</div>
      <div class="tiles">${tiles}</div>
      <div class="track"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div>
    </div></div>`;}).join('');
  fitThumbs();
}
const CROP={1335:{w:994,l:-408,t:-3},1512:{w:1282,l:-551,t:-3}};
function fitThumbs(){
  document.querySelectorAll('.thumb img').forEach(im=>{
    const ap=()=>{const c=CROP[im.naturalWidth];if(c){im.style.width=c.w+'px';im.style.left=c.l+'px';im.style.top=c.t+'px';}};
    if(im.complete&&im.naturalWidth)ap(); else im.addEventListener('load',ap,{once:true});
  });
}
function drawTable(){
  const rs=rows(), d=D[range];
  const th=['<th>Ad</th>','<th>Campaign</th>'].concat(M.map(m=>
    `<th data-k="${m[0]}"${m[0]===sortKey?' class="act"':''}>${m[1]}${m[0]===sortKey?(desc?' ▼':' ▲'):''}</th>`)).join('');
  const body=rs.map(a=>`<tr><td>${a.name}${a.type==='unmatched'?'<span class="tag">Unmatched</span>':''}</td>
    <td>${a.camp}</td>`+M.map(m=>`<td>${fmt(a,m[0])}</td>`).join('')+'</tr>').join('');
  const ts=rs.reduce((s,a)=>s+a.spend,0);
  const foot=`<tr><td>Totals (${rs.length} ads)</td><td></td><td>${usd(d.closed)}</td><td>${usd(ts)}</td>
    <td>${d.pay}</td><td>${ts>0?(d.closed/ts).toFixed(2)+'x':'n/a'}</td><td>${usd(d.pot)}</td>
    <td>${ts>0?(d.pot/ts).toFixed(2)+'x':'n/a'}</td></tr>`;
  document.getElementById('tableWrap').innerHTML=
    `<table><thead><tr>${th}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`;
  document.querySelectorAll('#tableWrap th[data-k]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.k; if(k===sortKey){desc=!desc;}else{sortKey=k;desc=true;} drawSort(); draw();});
}
function drawFoot(){
  const d=D[range];
  document.getElementById('foot').innerHTML=
    `Snapshot generated ${GEN}. Closed revenue, purchases (Searchlight paying customers) and revenue potential come from Searchlight, Meta Performance By, Facebook attribution channel. Spend, ad names and creative come from the Meta Ads API, account 7432973210049134. Both ROAS columns divide by the Meta spend shown on this page, so the arithmetic is checkable. They will not tie exactly to Searchlight's own ROAS, which uses its internal spend allocation. Searchlight reports ${usd2(d.slSpend)} of Facebook spend for this window against ${usd2(d.spend)} of Meta account spend; the gap is spend Searchlight does not attribute to the Facebook channel. Purchases are closed jobs from the CRM and will never match the purchase columns in Ads Manager. This page is a snapshot, not a live view.`;
}
function draw(){
  drawRanges();drawKpis();drawNote();
  document.getElementById('cards').style.display=view==='cards'?'flex':'none';
  document.getElementById('tableWrap').style.display=view==='table'?'block':'none';
  drawCards();drawTable();drawFoot();
  document.getElementById('vCards').className='tbtn'+(view==='cards'?' on':'');
  document.getElementById('vTable').className='tbtn'+(view==='table'?' on':'');
  document.querySelectorAll('#ranges .rbtn').forEach(b=>b.onclick=()=>{range=b.dataset.r;draw();});
}
document.getElementById('sortSel').onchange=e=>{sortKey=e.target.value;desc=true;drawSort();draw();};
document.getElementById('dirBtn').onclick=()=>{desc=!desc;drawSort();draw();};
document.getElementById('vCards').onclick=()=>{view='cards';draw();};
document.getElementById('vTable').onclick=()=>{view='table';draw();};
drawSort();draw();

</script>
